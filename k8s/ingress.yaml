# Requires ingress-nginx (installed by scripts/bootstrap.sh)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: model-api
  namespace: ml-serving
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: model-api
                port:
                  name: http
