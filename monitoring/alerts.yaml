apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: model-api-alerts
  namespace: ml-serving
  labels:
    release: monitoring
spec:
  groups:
    - name: model-api
      rules:
        - alert: ModelApiDown
          expr: absent(up{job="model-api"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Model API has no healthy targets
        - alert: ModelApiHighLatencyP95
          expr: histogram_quantile(0.95, sum(rate(predict_latency_seconds_bucket[5m])) by (le)) > 0.25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "p95 prediction latency above 250ms"
        - alert: ModelApiErrorRate
          expr: |
            sum(rate(predict_requests_total{outcome!="success"}[5m]))
              / clamp_min(sum(rate(predict_requests_total[5m])), 1e-9) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "More than 5% of prediction requests are failing"
